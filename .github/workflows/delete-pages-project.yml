# Manual, one-off: deletes a retired Cloudflare Pages project (for example after moving to a new name).
# It refuses to delete the project named by CLOUDFLARE_PAGES_PROJECT and first checks that the live
# site is answering. The R2 bucket is never touched.
name: Delete retired Pages project

on:
  workflow_dispatch:
    inputs:
      project:
        description: Name of the Pages project to delete
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OLD: ${{ inputs.project }}
      CURRENT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      SITE_URL: ${{ vars.SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Refuse to delete the active project
        run: |
          [ -n "$CURRENT" ] && [ "$OLD" != "$CURRENT" ] || { echo "Refusing to delete the active project ($CURRENT)."; exit 1; }
      - name: Check the live site first
        run: curl -fsS -o /dev/null --retry 3 "$SITE_URL/"
      - name: Delete the project
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$OLD" | tee /dev/stderr | grep -q '"success":true'
