      <stop offset="0%" stop-color="#1e2230" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0c0d12" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#937322"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGlow)"/>
  <circle cx="400" cy="270" r="160" fill="none" stroke="#252a3a" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="400" cy="270" r="120" fill="none" stroke="#2d3347" stroke-width="1"/>
  <circle cx="400" cy="270" r="80" fill="#141722" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Mythic Sigil / Eye Emblem -->
  <path d="M340,270 Q400,210 460,270 Q400,330 340,270 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="400" cy="270" r="22" fill="#d4af37" fill-opacity="0.2" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="400" cy="270" r="9" fill="#d4af37"/>

  <!-- Subtle compass / astral marks -->
  <line x1="400" y1="130" x2="400" y2="160" stroke="#d4af37" stroke-width="2"/>
  <line x1="400" y1="380" x2="400" y2="410" stroke="#d4af37" stroke-width="2"/>
  <line x1="260" y1="270" x2="290" y2="270" stroke="#d4af37" stroke-width="2"/>
  <line x1="510" y1="270" x2="540" y2="270" stroke="#d4af37" stroke-width="2"/>

  <!-- Text -->
  <text x="400" y="470" text-anchor="middle" font-family="'Cinzel', serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="4">
